services:
  # Aplicação Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: hospitable-app
    container_name: hospitable-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hospitable

  # Servidor web Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: hospitable-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8888}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hospitable

  # Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: hospitable-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hospitable}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-hospitable}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospitable

networks:
  hospitable:
    driver: bridge

volumes:
  pgdata:
    driver: local
