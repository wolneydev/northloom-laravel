openapi: 3.1.0
info:
  title: Hospitable Project Financial Management API
  version: 1.1.0
  description: Contracts for project currency, funds, costs, and task financial allocations.
servers:
  - url: http://localhost:8888/api
security:
  - bearerAuth: []
paths:
  /projects:
    get:
      operationId: listProjects
      summary: List projects owned by the caller
      parameters:
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated owned projects including configured currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createProject
      summary: Create a project with its currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{project}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get an owned project including its currency
      responses:
        "200":
          description: Owned project
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateProject
      summary: Update an owned project or configure its legacy currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid currency or currency is immutable after financial activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /projects/{project}/funds:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectFunds
      summary: List funds for an owned project
      parameters:
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated project funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectFund
      summary: Create a fund for an owned project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFundRequest"
      responses:
        "201":
          description: Fund created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Fund"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{project}/costs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectCosts
      summary: List costs for an owned project
      parameters:
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated project costs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectCost
      summary: Register a cost for an owned project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCostRequest"
      responses:
        "201":
          description: Cost registered
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Cost"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tasks/{task}/financial-allocations:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: createTaskFinancialAllocation
      summary: Allocate money from a project fund to an owned task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinancialAllocationRequest"
      responses:
        "201":
          description: Allocation and balance debit committed atomically
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FinancialAllocation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Caller does not own the task or selected fund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid amount, project mismatch, or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: project
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TaskId:
      name: task
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
  schemas:
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Supported active ISO 4217 currency code
      examples: ["BRL", "USD"]
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, starts_on, expected_ends_on, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        starts_on:
          type: string
          format: date
        expected_ends_on:
          type: string
          format: date
        notes:
          type: [string, "null"]
        currency:
          $ref: "#/components/schemas/Currency"
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        starts_on:
          type: string
          format: date
        expected_ends_on:
          type: string
          format: date
        notes:
          type: [string, "null"]
        currency:
          $ref: "#/components/schemas/Currency"
    Project:
      type: object
      required: [id, name, starts_on, expected_ends_on, notes, currency]
      properties:
        id:
          type: integer
        name:
          type: string
        starts_on:
          type: string
          format: date
        expected_ends_on:
          type: string
          format: date
        notes:
          type: [string, "null"]
        currency:
          oneOf:
            - $ref: "#/components/schemas/Currency"
            - type: "null"
          description: Null only for a legacy project awaiting configuration
    Money:
      type: string
      pattern: '^(0|[1-9][0-9]{0,12})\.[0-9]{2}$'
      examples: ["1250.00"]
    PositiveMoney:
      type: string
      pattern: '^(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,12}\.[0-9]{2})$'
      examples: ["250.00"]
    CreateFundRequest:
      type: object
      additionalProperties: false
      required: [name, opening_balance]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        opening_balance:
          $ref: "#/components/schemas/Money"
    Fund:
      type: object
      required:
        [id, project_id, currency, name, opening_balance, available_balance, created_at, updated_at]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        currency:
          $ref: "#/components/schemas/Currency"
        name:
          type: string
        opening_balance:
          $ref: "#/components/schemas/Money"
        available_balance:
          $ref: "#/components/schemas/Money"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateCostRequest:
      type: object
      additionalProperties: false
      required: [amount, description, incurred_on]
      properties:
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        description:
          type: string
          minLength: 1
          maxLength: 1000
        incurred_on:
          type: string
          format: date
    Cost:
      type: object
      required: [id, project_id, currency, amount, description, incurred_on, created_at, updated_at]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        currency:
          $ref: "#/components/schemas/Currency"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        description:
          type: string
        incurred_on:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateFinancialAllocationRequest:
      type: object
      additionalProperties: false
      required: [fund_id, amount]
      properties:
        fund_id:
          type: integer
          minimum: 1
        amount:
          $ref: "#/components/schemas/PositiveMoney"
    FinancialAllocation:
      type: object
      required: [id, task_id, fund_id, currency, amount, allocated_at, created_at, updated_at]
      properties:
        id:
          type: integer
        task_id:
          type: integer
        fund_id:
          type: integer
        currency:
          $ref: "#/components/schemas/Currency"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        allocated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaginationLinks:
      type: object
      additionalProperties: true
    PaginationMeta:
      type: object
      additionalProperties: true
    ProjectCollection:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    FundCollection:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Fund"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    CostCollection:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Cost"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
  responses:
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated user does not own the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request or domain validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
